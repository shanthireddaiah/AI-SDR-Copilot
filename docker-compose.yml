version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ai_sdr_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ai_sdr_db
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  web:
    build: .
    container_name: ai_sdr_web
    restart: always
    command: >
      sh -c "python init_db.py &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - chromadb_data:/app/chromadb_store
      - media_data:/app/media
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=django-insecure-ai-sdr-docker-key
      - DEBUG=True
      - ALLOWED_HOSTS=*
      - DB_ENGINE=django.db.backends.mysql
      - DB_NAME=ai_sdr_db
      - DB_USER=root
      - DB_PASSWORD=
      - DB_HOST=db
      - DB_PORT=3306
      - OPENAI_API_KEY=demo
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
  chromadb_data:
  media_data:
