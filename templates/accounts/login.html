{% extends 'base.html' %}

{% block title %}Sign In - AI SDR Copilot{% endblock %}
{% block page_heading %}Sign In{% endblock %}

{% block content %}
<div class="auth-bg-light">
  <div class="auth-card-light">
    
    <!-- Company Logo & Title Header -->
    <div class="text-center mb-4">
      <div class="sidebar-logo-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
        <i class="bi bi-robot"></i>
      </div>
      <h3 class="fw-bold text-dark mb-1" style="font-size: 22px;">AI SDR Copilot</h3>
      <p class="text-muted small mb-0">AI-Powered Sales Research Platform</p>
    </div>

    <form method="POST" action="{% url 'accounts:login' %}">
      {% csrf_token %}
      
      <div class="mb-3">
        <label for="id_username" class="form-label-saas">Username or Email</label>
        <input type="text" name="username" class="form-control form-control-saas" id="id_username" required autofocus placeholder="name@company.com">
      </div>

      <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label for="id_password" class="form-label-saas mb-0">Password</label>
          <a href="{% url 'accounts:password_reset' %}" class="saas-link extra-small">Forgot Password?</a>
        </div>
        <div class="input-group">
          <input type="password" name="password" class="form-control form-control-saas border-end-0" id="id_password" required placeholder="••••••••">
          <button class="btn btn-outline-secondary border border-start-0 bg-white password-toggle-btn px-3" type="button" data-target="id_password">
            <i class="bi bi-eye-fill text-muted"></i>
          </button>
        </div>
      </div>

      <!-- Remember Me Checkbox -->
      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" name="remember_me" id="remember_me">
        <label class="form-check-label small" for="remember_me" style="color: #4B5563;">
          Remember me on this device
        </label>
      </div>

      <button type="submit" class="btn btn-saas-primary w-100 py-2.5 mb-3">
        Sign In
      </button>

      <div class="text-center">
        <span class="text-muted small">Don't have an account?</span>
        <a href="{% url 'accounts:register' %}" class="saas-link small ms-1">Create Account</a>
      </div>
    </form>

  </div>
</div>
{% endblock %}
