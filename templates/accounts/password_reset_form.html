{% extends 'base.html' %}

{% block title %}Reset Password - AI SDR Copilot{% endblock %}
{% block page_heading %}Reset Password{% endblock %}

{% block content %}
<div class="auth-bg-light">
  <div class="auth-card-light">
    
    <div class="text-center mb-4">
      <div class="sidebar-logo-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
        <i class="bi bi-key-fill"></i>
      </div>
      <h3 class="fw-bold text-dark mb-1" style="font-size: 22px;">Reset Password</h3>
      <p class="text-muted small mb-0">Enter your email address to receive password reset instructions.</p>
    </div>

    <form method="POST">
      {% csrf_token %}
      
      <div class="mb-4">
        <label for="id_email" class="form-label-saas">Email Address</label>
        <input type="email" name="email" class="form-control form-control-saas" id="id_email" required autofocus placeholder="name@company.com">
      </div>

      <button type="submit" class="btn btn-saas-primary w-100 py-2.5 mb-3">
        Send Password Reset Email
      </button>

      <div class="text-center">
        <a href="{% url 'accounts:login' %}" class="saas-link small"><i class="bi bi-arrow-left me-1"></i> Back to Sign In</a>
      </div>
    </form>

  </div>
</div>
{% endblock %}
