{% extends "base.html" %}

{% block title %}404 - Page Not Found | AI SDR Copilot{% endblock %}

{% block content %}
<div class="container py-5 text-center" style="max-width: 600px;">
    <div class="card card-saas p-5">
        <div class="display-1 text-primary fw-bold mb-3">404</div>
        <h3 class="fw-semibold mb-3 text-dark">Page Not Found</h3>
        <p class="text-secondary mb-4">
            The page or resource you are looking for doesn't exist or may have been moved.
        </p>
        <div>
            <a href="{% url 'dashboard:index' %}" class="btn btn-saas-primary px-4 py-2">
                <i class="bi bi-house-door me-2"></i>Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
